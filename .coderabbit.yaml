# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for the Dimon Global Group estate.
# Review standard: Review Protocol v2 — adversarial, evidence-first.
# A finding names the defect and the evidence; approval requires the
# change to survive scrutiny, not the author's notes.

language: "en-US"
tone_instructions: >-
  Direct and plainspoken. No flattery, no filler. Every finding cites
  the line and the failure it causes. If a change cannot be verified
  from the diff, say so instead of guessing.
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
  path_filters: []
  path_instructions:
    - path: "**"
      instructions: >-
        Estate review law, applied to every file: reject stubs and
        placeholder implementations presented as finished work; reject
        weakened, skipped, or deleted tests; reject comments offered
        instead of fixes. Flag any secret, credential, token, or
        private data appearing in code, config, comments, or fixtures.
        Flag claims in docs or comments that the code does not support.
    - path: "**/*.py"
      instructions: >-
        Check error handling that hides failures (bare excepts,
        swallowed exceptions, silent fallbacks). Check for injection,
        path traversal, unsafe defaults, and unbounded operations.
        Verify that tests actually exercise the behavior they name.
    - path: "**/*.md"
      instructions: >-
        Check factual claims against the repository's own records
        where possible. Flag status claims (live, deployed, passing)
        that no artifact in the repo supports. Honest labels matter:
        speculation must read as speculation.

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  code_guidelines:
    enabled: true

chat:
  auto_reply: true
